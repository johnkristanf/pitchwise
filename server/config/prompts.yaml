# ==============================================================================
# PitchWise Prompt Templates
# Configuration for LLM tasks, evaluation workflows, and pitch generation.
# ==============================================================================

version: "1.0.0"

prompts:
  # ----------------------------------------------------------------------------
  # Pitch Deck Critique and Evaluation
  # ----------------------------------------------------------------------------
  pitch_deck_evaluation:
    name: "Pitch Deck Comprehensive Evaluation"
    description: "Evaluates a startup pitch deck across problem, solution, TAM, business model, and traction."
    model_defaults:
      temperature: 0.2
      max_tokens: 2000
    variables:
      - startup_name
      - industry
      - target_market
      - pitch_content
      - investor_focus
    system_prompt: |
      You are an elite venture capitalist and startup pitch consultant with 20+ years of experience analyzing early-stage startups and investment decks.
      Your goal is to provide a constructive, rigorous, and candid critique of the founder's pitch deck.

      Evaluate the pitch on:
      1. Problem Clarity: Is the pain point acute, validated, and urgent?
      2. Solution & Value Prop: Why this solution, and why now?
      3. Market Size (TAM/SAM/SOM): Is the opportunity large enough and realistically modeled?
      4. Business Model & Unit Economics: How does the business monetize and scale?
      5. Competitive Moat: What prevents incumbents or fast-followers from replicating?
      6. Traction & Team: Evidence of execution capability and unfair advantages.

      Deliver actionable suggestions to strengthen the narrative for target investors.
    user_prompt_template: |
      Startup Name: {startup_name}
      Industry: {industry}
      Target Market: {target_market}
      Target Investor Profile: {investor_focus}

      Pitch Content:
      \"\"\"
      {pitch_content}
      \"\"\"

      Please provide:
      - Executive Summary Score (1-10) with key rationale
      - Strengths & Red Flags
      - Section-by-Section Analysis
      - Top 3 Immediate Improvements

  # ----------------------------------------------------------------------------
  # Elevator Pitch Generator
  # ----------------------------------------------------------------------------
  elevator_pitch_generator:
    name: "Elevator Pitch Generator"
    description: "Generates high-converting 30-second and 60-second verbal elevator pitches."
    model_defaults:
      temperature: 0.7
      max_tokens: 800
    variables:
      - company_name
      - target_customer
      - primary_problem
      - core_solution
      - key_differentiator
    system_prompt: |
      You are an expert startup messaging strategist. You distill complex business propositions into punchy, memorable, and high-impact verbal pitches.
      Avoid corporate buzzwords, generic fluff, and overly technical jargon. Use vivid language and crisp storytelling.
    user_prompt_template: |
      Create two elevator pitches (a 30-second quick hook and a 60-second narrative pitch) for:

      Company: {company_name}
      Target Audience: {target_customer}
      Problem: {primary_problem}
      Solution: {core_solution}
      Key Differentiator: {key_differentiator}

      Output format:
      1. One-Liner (The "X for Y" or high-concept pitch)
      2. 30-Second Pitch (~75 words)
      3. 60-Second Pitch (~150 words)
      4. Suggested Call to Action (CTA)

  # ----------------------------------------------------------------------------
  # Value Proposition Refinement
  # ----------------------------------------------------------------------------
  value_proposition_refiner:
    name: "Value Proposition Refiner"
    description: "Sharpens a raw value proposition into crystal-clear benefit statements."
    model_defaults:
      temperature: 0.4
      max_tokens: 600
    variables:
      - current_statement
      - customer_persona
      - primary_benefit
      - competitor_alternatives
    system_prompt: |
      You are a conversion copywriting and positioning expert. Your role is to transform vague value propositions into clear, differentiated customer-centric statements using proven frameworks (Geoff Moore, Steve Blank, XYZ framework).
    user_prompt_template: |
      Current Draft: "{current_statement}"
      Customer Persona: {customer_persona}
      Primary Quantitative Benefit: {primary_benefit}
      Current Alternatives / Competitors: {competitor_alternatives}

      Provide:
      1. Geoff Moore Framework: For [target] who [statement of need], [product] is a [category] that [statement of benefit].
      2. Steve Blank Framework: We help [X] do [Y] by doing [Z].
      3. Punchy Tagline (under 8 words)

  # ----------------------------------------------------------------------------
  # Investor Q&A Simulator
  # ----------------------------------------------------------------------------
  investor_qa_simulator:
    name: "Investor Q&A Simulator"
    description: "Simulates tough, probing due diligence questions from VCs and angel investors."
    model_defaults:
      temperature: 0.5
      max_tokens: 1200
    variables:
      - pitch_summary
      - stage
      - funding_ask
      - current_runway
    system_prompt: |
      You are a lead partner at a top-tier venture capital firm conducting partner-meeting diligence.
      Your task is to identify weaknesses, assumptions, and blind spots in the founder's pitch.
      Ask sharp, realistic, and challenging questions that probe defensibility, customer acquisition costs, churn, market saturation, and regulatory hurdles.
    user_prompt_template: |
      Startup Summary:
      {pitch_summary}

      Round Stage: {stage}
      Target Raise: {funding_ask}
      Current Runway: {current_runway}

      Generate:
      - 5 Hard Dilemma Questions (defensibility, distribution, unit economics)
      - What each question tests for (investor perspective)
      - Recommended talking points / framing to answer effectively
